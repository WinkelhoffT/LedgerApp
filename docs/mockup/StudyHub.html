<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #dbeafe;
  --accent-softer: #eff6ff;
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f2f4f7;
  --border: #e5e8ed;
  --border-strong: #d3d8e0;
  --text: #14181f;
  --text-2: #576073;
  --text-3: #8b93a4;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow: 0 4px 12px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.10), 0 4px 8px rgba(16,24,40,.05);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --sidebar-w: 248px;
  --topbar-h: 62px;
  --c-blue:#2563eb; --c-violet:#7c3aed; --c-emerald:#059669; --c-amber:#d97706; --c-rose:#e11d48; --c-cyan:#0891b2;
}
[data-theme="dark"] {
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-soft: #1e3a5f;
  --accent-softer: #172438;
  --bg: #0d1017;
  --surface: #151a22;
  --surface-2: #1b212b;
  --border: #262d38;
  --border-strong: #333c48;
  --text: #e9edf3;
  --text-2: #9aa3b2;
  --text-3: #69727f;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 4px 12px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.25);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5), 0 4px 8px rgba(0,0,0,.3);
  --c-blue:#3b82f6; --c-violet:#a78bfa; --c-emerald:#34d399; --c-amber:#fbbf24; --c-rose:#fb7185; --c-cyan:#22d3ee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
  transition: background .25s, color .25s;
}
.mono { font-family: 'JetBrains Mono', monospace; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

/* ---------- Layout shell ---------- */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; bottom: 0;
  display: flex; flex-direction: column;
  z-index: 40;
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
.brand {
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 11px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  display: grid; place-items: center; color: #fff; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(37,99,235,.35);
}
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.brand-name span { color: var(--accent); }
.nav { flex: 1; overflow-y: auto; padding: 12px 12px; }
.nav-section-label {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .07em; color: var(--text-3);
  padding: 14px 12px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  color: var(--text-2); font-weight: 500; font-size: 13.5px;
  width: 100%; text-align: left; position: relative;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-softer); color: var(--accent); font-weight: 600; }
.nav-item.active::before {
  content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.nav-item svg { flex-shrink: 0; }
.nav-badge {
  margin-left: auto; font-size: 11px; font-weight: 600;
  background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 20px;
}
.nav-item.active .nav-badge { background: var(--accent); }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }
.user-chip {
  display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm);
  transition: background .15s;
}
.user-chip:hover { background: var(--surface-2); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg,#7c3aed,#2563eb); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: 13px;
}
.user-meta { line-height: 1.25; min-width: 0; }
.user-meta b { font-size: 13px; font-weight: 600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-meta small { font-size: 11.5px; color: var(--text-3); }

/* Main */
.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 28px;
}
.hamburger { display:none; }
.page-title { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.page-sub { font-size: 12.5px; color: var(--text-3); margin-top: 1px; }
.search-global {
  margin-left: auto; display: flex; align-items: center; gap: 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; width: 260px; color: var(--text-3); font-size: 13px;
  transition: border .15s, box-shadow .15s;
}
.search-global:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-softer); }
.search-global input { border: none; outline: none; background: none; flex: 1; color: var(--text); font-size: 13px; }
.search-global kbd {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; color: var(--text-3);
}
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  color: var(--text-2); border: 1px solid transparent; transition: all .15s; position: relative;
}
.icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-rose); border: 2px solid var(--bg); }
.content { padding: 28px; flex: 1; }
.content-wide { max-width: 1280px; margin: 0 auto; }

/* Page fade */
.page { animation: fade .32s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Reusable ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  padding: 9px 15px; border-radius: 10px; font-weight: 600; font-size: 13px;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(37,99,235,.3); }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(37,99,235,.35); transform: translateY(-1px); }
.btn-ghost { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.btn-soft { background: var(--accent-softer); color: var(--accent); }
.btn-soft:hover { background: var(--accent-soft); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, border-color .2s, transform .2s;
}
.card-pad { padding: 20px; }
.card-hover:hover { box-shadow: var(--shadow); border-color: var(--border-strong); transform: translateY(-2px); }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; display:flex; align-items:center; gap:8px; }
.link-more { font-size: 12.5px; font-weight: 600; color: var(--accent); display:flex; align-items:center; gap:3px; }
.link-more:hover { gap: 6px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
  border-radius: 7px; font-size: 11.5px; font-weight: 500;
  background: var(--surface-2); color: var(--text-2);
}
.chip-dot { width: 7px; height: 7px; border-radius: 50%; }
.tag {
  font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}

.filetype { font-family:'JetBrains Mono',monospace; font-size: 10px; font-weight: 600; padding: 3px 6px; border-radius: 5px; text-transform: uppercase; }
.ft-pdf { background: rgba(225,29,72,.12); color: var(--c-rose); }
.ft-doc { background: rgba(37,99,235,.12); color: var(--c-blue); }
.ft-ppt { background: rgba(217,119,6,.12); color: var(--c-amber); }
.ft-md  { background: rgba(5,150,105,.12); color: var(--c-emerald); }
.ft-zip { background: rgba(124,58,237,.12); color: var(--c-violet); }

.progress { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }

.grid { display: grid; gap: 16px; }

/* Dashboard specifics */
.stat-grid { grid-template-columns: repeat(4, 1fr); }
.stat {
  padding: 18px; display: flex; flex-direction: column; gap: 10px;
}
.stat-top { display: flex; align-items: center; justify-content: space-between; }
.stat-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
.stat-val { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.stat-label { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.stat-delta { font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 3px; }
.up { color: var(--c-emerald); } .down { color: var(--c-rose); }

.dash-grid { grid-template-columns: 2fr 1fr; align-items: start; }
.session-item, .deadline-item, .doc-row, .note-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 0;
  border-bottom: 1px solid var(--border);
}
.session-item:last-child, .deadline-item:last-child, .doc-row:last-child, .note-row:last-child { border-bottom: none; }
.time-badge { font-family:'JetBrains Mono',monospace; font-size: 11.5px; font-weight: 600; color: var(--text-2); background: var(--surface-2); padding: 4px 8px; border-radius: 7px; white-space: nowrap; }
.course-bar { width: 3px; align-self: stretch; border-radius: 3px; min-height: 34px; }
.item-title { font-weight: 600; font-size: 13.5px; }
.item-sub { font-size: 12px; color: var(--text-3); }
.deadline-pill { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.dl-urgent { background: rgba(225,29,72,.12); color: var(--c-rose); }
.dl-soon { background: rgba(217,119,6,.12); color: var(--c-amber); }
.dl-later { background: var(--surface-2); color: var(--text-2); }

.quick-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick-btn {
  display: flex; align-items: center; gap: 11px; padding: 13px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); text-align: left; transition: all .15s;
}
.quick-btn:hover { border-color: var(--accent); background: var(--accent-softer); transform: translateY(-1px); }
.quick-ic { width: 34px; height: 34px; border-radius: 9px; display:grid; place-items:center; flex-shrink:0; }
.quick-btn b { font-size: 13px; font-weight: 600; display: block; }
.quick-btn small { font-size: 11px; color: var(--text-3); }

/* Ring progress */
.ring-wrap { display:flex; align-items:center; gap: 18px; }
.ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-label b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.ring-label small { font-size: 10px; color: var(--text-3); display: block; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 8px; }
.legend-row .val { margin-left: auto; font-weight: 600; font-family:'JetBrains Mono',monospace; font-size: 12px; }

/* Bar chart */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px; background: var(--accent); transition: height .5s cubic-bezier(.4,0,.2,1); position: relative; }
.bar.dim { background: var(--accent-soft); }
.bar-label { font-size: 11px; color: var(--text-3); font-weight: 500; }

/* Courses */
.course-grid { grid-template-columns: repeat(3, 1fr); }
.course-card { overflow: hidden; }
.course-top { height: 84px; position: relative; display: flex; align-items: flex-end; padding: 14px; }
.course-top::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.28)); }
.course-code { position: relative; z-index: 1; font-family:'JetBrains Mono',monospace; font-weight: 600; font-size: 12px; color: #fff; background: rgba(0,0,0,.25); padding: 4px 9px; border-radius: 7px; backdrop-filter: blur(4px); }
.course-body { padding: 15px; }
.course-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 4px; }
.course-desc { font-size: 12.5px; color: var(--text-3); line-height: 1.5; margin-bottom: 14px; min-height: 38px; }
.course-meta { display: flex; gap: 14px; margin-bottom: 13px; }
.course-meta div { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.course-prog-row { display:flex; align-items:center; justify-content:space-between; font-size:11.5px; margin-bottom: 6px; color: var(--text-3); font-weight: 500; }

/* FAB */
.fab {
  position: fixed; bottom: 30px; right: 34px; z-index: 45;
  height: 52px; padding: 0 22px 0 18px; border-radius: 16px; gap: 9px;
  background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; box-shadow: 0 8px 24px rgba(37,99,235,.4);
  transition: all .18s;
}
.fab:hover { background: var(--accent-hover); transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 30px rgba(37,99,235,.5); }

/* Calendar */
.cal-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
.cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.cal-month { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-2); border: 1px solid var(--border); background: var(--surface); transition: all .15s; }
.cal-nav button:hover { background: var(--surface-2); color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; gap: 1px; }
.cal-dow { background: var(--surface); padding: 10px 0; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.cal-cell { background: var(--surface); min-height: 104px; padding: 8px; display: flex; flex-direction: column; gap: 4px; transition: background .15s; cursor: pointer; }
.cal-cell:hover { background: var(--surface-2); }
.cal-cell.other { background: var(--bg); }
.cal-cell.other .cal-num { color: var(--text-3); opacity: .5; }
.cal-cell.sel { background: var(--accent-softer); outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-num { font-size: 12.5px; font-weight: 600; color: var(--text-2); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; }
.cal-cell.today .cal-num { background: var(--accent); color: #fff; }
.cal-ev { font-size: 10.5px; font-weight: 600; padding: 3px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid; }
.cal-more { font-size: 10px; color: var(--text-3); font-weight: 600; padding-left: 6px; }
.side-panel-date { font-size: 13px; color: var(--text-3); font-weight: 500; }
.side-panel-day { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 16px; }
.session-card { padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); border-left: 3px solid; margin-bottom: 10px; background: var(--surface); transition: all .15s; }
.session-card:hover { box-shadow: var(--shadow-sm); }
.session-card .sc-time { font-family:'JetBrains Mono',monospace; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.session-card .sc-title { font-weight: 600; font-size: 13.5px; margin: 3px 0 2px; }
.session-card .sc-sub { font-size: 12px; color: var(--text-3); }

/* Documents */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.search-bar {
  display: flex; align-items: center; gap: 9px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; flex: 1; min-width: 200px;
  transition: border .15s, box-shadow .15s;
}
.search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-softer); }
.search-bar input { border: none; outline: none; background: none; flex: 1; color: var(--text); font-size: 13px; }
.filter-select { display: flex; align-items: center; gap: 7px; padding: 9px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--text-2); transition: all .15s; }
.filter-select:hover { border-color: var(--border-strong); color: var(--text); }
.view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.view-toggle button { width: 32px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--text-3); }
.view-toggle button.active { background: var(--accent-softer); color: var(--accent); }
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); padding: 0 14px 12px; }
.doc-table td { padding: 13px 14px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.doc-table tr { transition: background .12s; }
.doc-table tbody tr:hover { background: var(--surface-2); }
.doc-name-cell { display: flex; align-items: center; gap: 11px; }
.doc-ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
.doc-grid-view { grid-template-columns: repeat(4, 1fr); }
.doc-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.doc-card-ic { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; }

/* Notes */
.notes-layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); height: calc(100vh - var(--topbar-h) - 56px); box-shadow: var(--shadow-sm); }
.notes-list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.notes-list-head { padding: 14px; border-bottom: 1px solid var(--border); }
.note-search { display:flex; align-items:center; gap:8px; background: var(--surface-2); border-radius: 9px; padding: 8px 11px; margin-bottom: 10px; }
.note-search input { border:none; outline:none; background:none; flex:1; color:var(--text); font-size:12.5px; }
.note-tags-row { display: flex; gap: 6px; flex-wrap: wrap; }
.note-tag-f { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; background: var(--surface-2); color: var(--text-2); transition: all .12s; }
.note-tag-f.active { background: var(--accent); color: #fff; }
.notes-scroll { overflow-y: auto; flex: 1; }
.note-list-item { padding: 13px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; border-left: 3px solid transparent; }
.note-list-item:hover { background: var(--surface-2); }
.note-list-item.active { background: var(--accent-softer); border-left-color: var(--accent); }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; opacity: 0; pointer-events: none; transition: opacity .25s; }

Two fundamental shortest-path algorithms with different trade-offs.

## Dijkstra's Algorithm
- **Greedy** approach using a priority queue
- Time complexity: \`O((V + E) log V)\`
- **Cannot** handle negative edge weights
- Best for: sparse graphs with non-negative weights

## Bellman-Ford
- **Dynamic programming** approach
- Time complexity: \`O(V · E)\`
- **Can** handle negative weights and detect negative cycles

> Rule of thumb: reach for Dijkstra when weights are non-negative, and Bellman-Ford when they aren't.

## Quick comparison
- Speed: Dijkstra wins
- Flexibility: Bellman-Ford wins

function pageCalendar(){

  const firstDow=6, days=30, prevDays=31;
  let cells='';
  for(let i=firstDow-1;i>=0;i--) cells+=cellHTML(prevDays-i,true,0);
  for(let d=1;d<=days;d++) cells+=cellHTML(d,false,d);
  const total=firstDow+days; for(let d=1;cells && total+d-1<42;d++){ cells+=cellHTML(d,true,0); if(total+d>=42)break; }
  const sel=selDay;
  const evs=(calEvents[sel]||[]);
  return `<div class="page">
    <div class="cal-head">
      <div class="cal-month">November 2025</div>
      <div class="cal-nav"><button>${icon('chevL',17)}</button><button>${icon('chevR',17)}</button></div>

            <div class="session-card" style="border-left-color:${cc(e[0])}">
              <div class="sc-time">${s.time||'09:00'} · ${s.dur||'60m'}</div>

              <div class="sc-sub">${e[0]} · ${courseByCode[e[0]]?.name||''}</div>

    const evs=other?[]:(calEvents[realDay]||[]);
    const today=realDay===25;

    let e=evs.slice(0,2).map(x=>`<div class="cal-ev" style="background:${tint(cc(x[0]),.13)};color:${cc(x[0])};border-left-color:${cc(x[0])}">${x[1]}</div>`).join('');

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdToHtml(md){
  let h=escapeHtml(md);
  const blocks=h.split(/\n/);
  let out='', inList=false, inCode=false;
  for(let line of blocks){
    if(line.startsWith('> ')){ out+=`<blockquote>${inlineMd(line.slice(2))}</blockquote>`; continue; }
    if(/^### /.test(line)){ out+=`<h3>${inlineMd(line.slice(4))}</h3>`; continue; }
    if(/^## /.test(line)){ out+=`<h2>${inlineMd(line.slice(3))}</h2>`; continue; }
    if(/^# /.test(line)){ out+=`<h1>${inlineMd(line.slice(2))}</h1>`; continue; }
    if(/^- /.test(line)){ if(!inList){out+='<ul>';inList=true;} out+=`<li>${inlineMd(line.slice(2))}</li>`; continue; }
    if(inList){ out+='</ul>'; inList=false; }
    if(line.trim()==='') continue;
    out+=`<p>${inlineMd(line)}</p>`;
  }
  if(inList) out+='</ul>';
  return out;
}
function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
}

function lineChart(){
  const data=[14,18,16,22,19,25,21,24.5];
  const max=28, w=460, h=170, pad=8;
  const step=(w-pad*2)/(data.length-1);
  const pts=data.map((v,i)=>[pad+i*step, h-pad-(v/max)*(h-pad*2)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${line} L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z`;
  return `<svg class="line-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>`).join('')}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)" class="mono">
    ${['W1','W2','W3','W4','W5','W6','W7','Now'].map(l=>`<span>${l}</span>`).join('')}
  </div>`;
}

/* ============ ROUTER ============ */
let current='dashboard';
const renderers={dashboard:pageDashboard,courses:pageCourses,calendar:pageCalendar,documents:pageDocuments,notes:pageNotes,ai:pageAI,analytics:pageAnalytics};
function render(){
  const view=document.getElementById('view');
  const fn=renderers[current];
  view.innerHTML = fn?fn():pageEmpty(current);
}
function go(id){
  current=id;
  const p=pages.find(x=>x.id===id);
  document.getElementById('pageTitle').textContent=p.title;
  document.getElementById('pageSub').textContent=p.sub;
  highlightNav();
  render();
  window.scrollTo(0,0);
  if(window.innerWidth<=900) closeSidebar();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
function toggleTheme(){
  const html=document.documentElement;
  const dark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',dark?'light':'dark');
  updateThemeBtn();
}
function updateThemeBtn(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeBtn').innerHTML=icon(dark?'sun':'moon',19);
}

/* ============ INIT ============ */
renderNav();
updateThemeBtn();
render();
