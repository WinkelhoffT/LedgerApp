name: StudyHub CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x


    - name: Restore dependencies
      run: dotnet restore src/StudyHub.sln


    - name: Build
      run: dotnet build src/StudyHub.sln --configuration Release --no-restore


    - name: Test
      run: dotnet test src/StudyHub.sln --configuration Release --no-build